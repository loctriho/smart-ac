# MariaDB-backed integration tests (optional profile; mysql-test name kept for compatibility).
# Activate:
#   mvn test -Dspring.profiles.active=mysql-test
#   mvn -q test -Dtest=DeviceApiLoadStressTest -Dspring.profiles.active=mysql-test
#   mvn -q test -Dtest=DeviceReadingsExecutorWorkerBenchmarkTest -Dbulk.bench.run=true -Dspring.profiles.active=mysql-test
#   mvn -q test -Dtest=DeviceBulkInsertSingleVsExecutorBenchmarkTest "-Dbulk.compare.run=true"
#       (DeviceBulkInsertSingleVsExecutorBenchmarkTest always activates mysql-test on the class)
#
# Requires a reachable MariaDB server (defaults match src/main/resources/application.properties).
# Override with MYSQL_HOST, MYSQL_PORT, MYSQL_DATABASE, MYSQL_USER, MYSQL_PASSWORD.

spring.datasource.url=jdbc:mariadb://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:smartac}?createDatabaseIfNotExist=true&characterEncoding=utf8&timezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=false
