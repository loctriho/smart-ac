spring.application.name=smart-ac-poc

# Optional: run tests against MySQL instead — see application-mysql-test.properties (profile mysql-test).

# In-memory H2 for tests (no MySQL required)
spring.datasource.url=jdbc:h2:mem:smartac;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

# Keep tests aligned with main runtime when running on Java 21.
spring.threads.virtual.enabled=true

# Match main app: flat keys for AppProperties record (invitationExpiryHours, etc.)
app.base-url=http://localhost:8080
app.bootstrap.email=admin@smartac.local
app.bootstrap.password=ChangeMe!Admin2024
app.invitation-expiry-hours=72
app.password-reset-token-minutes=60
app.dev-log-password-reset-links=true

# Disable per-device readings rate limit so tests can issue bursts; bulk still returns 202 and runs on executor
app.device-ingest.readings-rate-limit-seconds=0
app.device-ingest.queue-capacity=256
app.device-ingest.worker-threads=1
