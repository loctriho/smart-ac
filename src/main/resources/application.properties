spring.application.name=smart-ac-poc

# MariaDB (override with MYSQL_* env vars or a local profile)
spring.datasource.url=jdbc:mariadb://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:smartac}?createDatabaseIfNotExist=true&characterEncoding=utf8&timezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# JDBC URL for read replicas can be introduced later (routing DataSource); example placeholder:
# app.datasource.read.jdbc-url=jdbc:mariadb://read-replica:3307/smartac?characterEncoding=utf8&timezone=UTC

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Use Java 21 virtual threads for request handling where supported (Spring Boot 3.2+).
# Note: your bulk ingest executor remains bounded separately (still returns 503 when saturated).
spring.threads.virtual.enabled=true

server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
# Limits POST body size (Tomcat); raise if devices send very large bulk JSON.
server.tomcat.max-http-form-post-size=10MB

# WebClient / codec default (also set for consistency if reactive clients are added)
spring.codec.max-in-memory-size=10MB

spring.h2.console.enabled=false

server.port=8080

# Base URL for invitation / password-reset links (override in production)
app.base-url=http://localhost:8080

# Bootstrap admin (created on first run if no admins exist)
app.bootstrap.email=admin@smartac.local
app.bootstrap.password=ChangeMe!Admin2024

# Invitation validity (hours) — must map to AppProperties.invitationExpiryHours (flat, not app.invitation.*)
app.invitation-expiry-hours=72

# Password reset token validity (minutes) — must map to AppProperties.passwordResetTokenMinutes
app.password-reset-token-minutes=60

# When true and mail is not configured, password-reset links are logged to console
app.dev-log-password-reset-links=true

# Optional SMTP — if absent, reset links are only logged when app.dev-log-password-reset-links=true
# spring.mail.host=smtp.example.com
# spring.mail.port=587
# spring.mail.username=
# spring.mail.password=
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# Device ingest: per-device readings rate limit (seconds), bounded executor for async bulk, idempotency in-memory.
# recordedAt is normalized to UTC minute precision (seconds cleared); future check uses UTC minutes.
app.device-ingest.readings-rate-limit-seconds=60
app.device-ingest.queue-capacity=20000
app.device-ingest.worker-threads=16
app.device-ingest.max-samples-per-request=500
app.device-ingest.persist-batch-size=200
app.device-ingest.idempotency-ttl-hours=24
app.device-ingest.idempotency-max-entries=5000
