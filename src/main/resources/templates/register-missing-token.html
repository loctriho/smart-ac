<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Invitation required</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}" />
  </head>
  <body>
    <div class="login-page">
      <div class="login-card">
        <h1>Invitation required</h1>
        <p class="muted">Open the private invitation link you received. It looks like:</p>
        <code style="color: var(--accent); word-break: break-all">/register?token=…</code>
        <p style="margin-top: 1rem"><a th:href="@{/login}" style="color: var(--accent)">Sign in</a></p>
      </div>
    </div>
  </body>
</html>
