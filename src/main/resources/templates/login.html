<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — Smart AC</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}" />
  </head>
  <body>
    <div class="login-page">
      <div class="login-card">
        <h1>Admin sign in</h1>
        <p class="muted">Smart AC proof of concept</p>
        <div th:if="${param.error}" class="alert alert--error">Invalid email or password.</div>
        <div th:if="${param.logout}" class="alert alert--ok">You have been signed out.</div>
        <div th:if="${param.reset}" class="alert alert--ok">Password updated. You can sign in.</div>
        <div th:if="${param.registered}" class="alert alert--ok">Account created. Sign in below.</div>
        <form th:action="@{/login}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <div class="field">
            <label for="username">Email</label>
            <input id="username" name="username" type="email" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <button type="submit" class="btn">Sign in</button>
        </form>
        <p style="margin-top: 1rem">
          <a class="muted" th:href="@{/forgot-password}" style="color: var(--accent)">Forgot password?</a>
        </p>
      </div>
    </div>
  </body>
</html>
