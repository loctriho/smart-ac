<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset password</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}" />
  </head>
  <body>
    <div class="login-page">
      <div class="login-card">
        <h1>Reset password</h1>
        <p class="muted">Enter your admin email. If it exists, a reset link is generated (see server log in dev).</p>
        <form th:action="@{/forgot-password}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required />
          </div>
          <button type="submit" class="btn">Send reset</button>
        </form>
        <p><a th:href="@{/login}" style="color: var(--accent)">Back to sign in</a></p>
      </div>
    </div>
  </body>
</html>
